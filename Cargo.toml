[package]
name = "docent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A context-aware reading companion for the terminal, Neovim, and the browser"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.35"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.0"
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"
