[package]
name = "docent"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A context-aware reading companion for the terminal, Neovim, and the browser"
license = "AGPL-3.0-only"
authors = ["aa-p"]
repository = "https://github.com/apanoush/docent"
readme = "README.md"
keywords = ["llm", "cli", "pdf", "reading", "context"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.wix]
upgrade-guid = "A2895CD0-41CF-442B-86A1-7660AB99BADE"
path-guid = "5A6B2066-871A-4A60-AC1C-672D934C6186"
license = false
eula = false

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
env_logger = "0.11.11"
getrandom = "0.4.3"
log = "0.4.35"
pdf-extract = "0.12.1"
pdf-inspector = "~1.25"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
pulldown-latex = "0.8.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
thiserror = "2.0.21"
toml = "1.2.0"
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
