# Lint, test, and measure coverage of the crate on every push and pull request.
#
# This is separate from release.yml, which cargo-dist generates and which only
# builds release artifacts. Running clippy on Windows as well as Linux keeps
# cfg-gated code honest: a binding whose only use sits behind #[cfg(unix)] is
# otherwise flagged only by the Windows build. Coverage runs on Linux only and
# enforces the same 80% line floor as scripts/check.sh.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The runner images ship a current stable toolchain (>= 1.88, as required
      # by the edition 2024 crate).
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test
        run: cargo test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # --all-targets matches scripts/check.sh, so the enforced number is the
      # one measured locally. The floor fails the job; the report is uploaded
      # for inspection when it does.
      - name: Measure coverage
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info --fail-under-lines 80
      - name: Upload lcov report
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
