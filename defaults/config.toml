# docent configuration
#
# The API key comes from the environment variable named by api_key_env.
# Alternatively, store it directly in api_key. When both are set, the
# environment variable wins. api_key_env is safer for shared machines and
# for config files kept in a dotfiles repository.

[provider]
wire_format = "openai"          # openai | anthropic
base_url = "https://opencode.ai/inference/go/openai/v1"
model = "deepseek-v4.1-flash"
api_key_env = "OPENCODE_API_KEY"
# api_key = "sk-..."           # optional; this file is created with mode 0600
timeout_secs = 120
max_tokens = 1200
temperature = 0.3

[context]
mode = "auto"                  # auto | full | none
max_chars = 32000

[response]
language = "auto"              # auto, or e.g. "English"
target_language = "English"

[viewer]
default = "terminal"           # terminal | qutebrowser | firefox
qutebrowser = "qutebrowser"
qutebrowser_target = "window"  # auto | tab | tab-bg | tab-silent | tab-bg-silent | window | private-window
# qutebrowser_args = ["--qt-arg", "name", "qute-docent"]  # extra argv entries, inserted before the answer URL
firefox = "firefox"
firefox_target = "window"      # auto | tab | window | private-window

[history]
enabled = true                 # record provider runs in a local SQLite database
# database = "~/docent.db"     # default: platform data directory, e.g. ~/.local/share/docent/docent.db
#                              # supports ~ and $VARS, resolved against this config directory

[cache]
enabled = true                 # reuse stored answers for identical prompts and settings
max_entries = 1000             # least recently used entries are evicted beyond this

# ---------------------------------------------------------------------------
# Provider examples
#
# To use another provider, replace the [provider] block above with one of these.
# Keep exactly one active [provider] block.
#
# OpenAI direct:
# [provider]
# wire_format = "openai"
# base_url = "https://api.openai.com/v1"
# model = "your-model-id"
# api_key_env = "OPENAI_API_KEY"
# timeout_secs = 120
# max_tokens = 1200
# temperature = 0.3
#
# Anthropic direct:
# [provider]
# wire_format = "anthropic"
# base_url = "https://api.anthropic.com"
# model = "your-model-id"
# api_key_env = "ANTHROPIC_API_KEY"
# timeout_secs = 120
# max_tokens = 1200
# temperature = 0.3
#
# OpenCode Console (pay as you go):
# [provider]
# wire_format = "openai"
# base_url = "https://opencode.ai/inference/openai/v1"
# model = "deepseek-v4.1-flash"
# api_key_env = "OPENCODE_API_KEY"
#
# Local OpenAI-compatible server:
# [provider]
# wire_format = "openai"
# base_url = "http://localhost:11434/v1"
# model = "your-model-id"
# api_key_env = "LOCAL_API_KEY"
